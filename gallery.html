<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Sajad Troy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Prata&display=swap"
        rel="stylesheet">

    <style>
        /* --- VINTAGE STYLES --- */
        :root {
            --bg: #ffffff;
            --ink: #000000;
            --border: 1px solid var(--ink);
            --spacing: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            border-top: var(--border);
            border-left: var(--border);
        }

        .row {
            display: flex;
            border-bottom: var(--border);
        }

        .col {
            padding: var(--spacing);
            border-right: var(--border);
        }

        /* Typography */
        h1 {
            font-family: 'Prata', serif;
            font-size: 3rem;
            margin-bottom: 5px;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        /* Nav */
        nav {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--ink);
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-link:hover {
            text-decoration: line-through;
        }

        /* --- THE GALLERY GRID --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            min-height: 400px;
        }

        .gallery-item {
            border-right: var(--border);
            border-bottom: var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s;
        }

        .gallery-item:hover {
            background-color: #f4f4f4;
        }

        .photo-frame {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #eee;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* IMAGE STYLING */
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            /* Force B&W */
            transition: filter 0.3s, transform 0.5s;
        }

        .gallery-item:hover .photo-frame img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .caption {
            font-family: 'Prata', serif;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 5px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* Stats */
        .stats-box {
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Loading State */
        .loading-msg {
            padding: 40px;
            text-align: center;
            width: 100%;
            grid-column: span 3;
        }

        @media (max-width: 768px) {
            .header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item {
                border-right: var(--border);
            }

            .loading-msg {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="row header-row"
            style="padding: 24px; border-right: 1px solid black; justify-content: space-between; align-items: center;">
            <span style="font-family: 'Prata', serif; font-size: 1.2rem; font-weight: bold;">ST.</span>
            <nav>
                <a href="index.html" class="nav-link">Home</a>
                <a href="gallery.html" class="nav-link" style="text-decoration: line-through;">Gallery</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>
        </div>

        <div class="row">
            <div class="col" style="width: 100%;">
                <span class="label">Archive</span>
                <h1>Visual Diary</h1>

                <p id="bio-text" style="max-width: 600px; white-space: pre-line;">Loading biography...</p>

                <div class="stats-box">
                    <span id="follower-count">...</span> Followers
                </div>
            </div>
        </div>

        <div class="gallery-grid" id="insta-grid">
            <div class="loading-msg">Fetching data from Instagram...</div>
        </div>

        <div class="row" style="border-right: var(--border);">
            <div class="col" style="width: 100%; text-align: center;">
                <p style="font-size: 0.7rem; text-transform: uppercase;">© 2025 Sajad Troy</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchInstagram() {
            // Your specific Behold URL
            const feedUrl = 'https://feeds.behold.so/WMDhzdzEhqreq6tsWwAj';

            const grid = document.getElementById('insta-grid');
            const bioText = document.getElementById('bio-text');
            const followerCount = document.getElementById('follower-count');

            try {
                const response = await fetch(feedUrl);
                const data = await response.json();

                // 1. UPDATE PROFILE INFO
                if (data.biography) {
                    bioText.innerText = data.biography;
                }
                if (data.followersCount) {
                    followerCount.innerText = data.followersCount;
                }

                // 2. CLEAR LOADING MESSAGE
                grid.innerHTML = '';

                // 3. LOOP THROUGH POSTS
                data.posts.forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';

                    // DECISION: If it's a VIDEO, use 'thumbnailUrl', else use 'mediaUrl'
                    let finalImageUrl = post.mediaUrl;
                    if (post.mediaType === 'VIDEO' && post.thumbnailUrl) {
                        finalImageUrl = post.thumbnailUrl;
                    }

                    // Prune caption (limit length)
                    let caption = post.caption || '';
                    if (caption.length > 30) {
                        caption = caption.substring(0, 30) + "...";
                    }

                    // Build HTML
                    item.innerHTML = `
                        <a href="${post.permalink}" target="_blank" style="text-decoration:none; color:black; width:100%;">
                            <div class="photo-frame">
                                <img src="${finalImageUrl}" loading="lazy" alt="Instagram Post">
                            </div>
                            <div class="caption">${caption}</div>
                            <div class="meta">
                                ${post.mediaType === 'VIDEO' ? '▶ Watch Reel' : 'View Post'} ↗
                            </div>
                        </a>
                    `;

                    grid.appendChild(item);
                });

            } catch (error) {
                console.error("Error fetching feed:", error);
                grid.innerHTML = '<div class="loading-msg">Unable to load feed. Please reload.</div>';
            }
        }

        // Run on load
        fetchInstagram();
    </script>

</body>

</html>
