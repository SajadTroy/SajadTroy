<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chronicles | Sajad Troy - Articles</title>
    <meta name="description"
        content="Technical articles, entrepreneurial insights, and stories from the digital realm by Sajad Troy.">
    <meta name="keywords"
        content="Sajad Troy, Grovix CMS, Article Platform, Software Engineer, Tech Content Creator, Troy Capital, Lufta Sweets, Web Development Kerala">
    <meta name="author" content="Sajad Troy">

    <link rel="icon" type="image/png" href="https://sajadtroy.com/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://sajadtroy.com/favicon.svg" />
    <link rel="shortcut icon" href="https://sajadtroy.com/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://sajadtroy.com/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SajadTroy" />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Bebas+Neue&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            --stranger-red: #cc2b2b;
            --op-gold: #ffcc00;
            --border: rgba(204, 43, 43, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat top center;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--stranger-red);
            text-transform: uppercase;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .back-home {
            text-decoration: none;
            color: var(--stranger-red);
            transition: 0.2s;
        }

        .back-home:hover {
            color: var(--op-gold);
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            /* Matched to Index */
            font-weight: 400;
            margin-bottom: 4px;
            color: var(--text-main);
            text-shadow: 2px 2px 0px var(--stranger-red);
            letter-spacing: 2px;
        }

        .blog-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 550px;
            border-left: 2px solid var(--stranger-red);
            padding-left: 20px;
            margin-bottom: 24px;
        }

        .api-tag {
            color: var(--op-gold);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #posts-loader {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 40px;
        }

        .posts-section {
            margin-top: 40px;
        }

        .post-item {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
        }

        .post-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--stranger-red);
            padding-top: 4px;
            text-transform: uppercase;
        }

        .post-content .post-category {
            font-size: 11px;
            color: var(--op-gold);
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            display: block;
            margin-bottom: 4px;
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .post-item:hover .post-title {
            color: var(--op-gold);
        }

        .post-excerpt {
            font-size: 14px;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 500px) {
            .post-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="particles"></div>

    <div class="container">
        <div class="top-bar">
            <span><a href="index.html" class="back-home">EST. 2020 ←</a></span>
            <span id="clock">00:00:00</span>
        </div>

        <header>
            <h1>CHRONICLES</h1>
            <div class="blog-subtitle">
                Technical articles and entrepreneurial insights from the digital realm. Navigating the grand line of
                technology through code.
            </div>
            <span class="api-tag">Synced via Grovix API</span>
        </header>

        <div id="posts-loader">Decrypting signal...</div>
        <section class="posts-section" id="blog-posts"></section>

        <footer>
            <span>© <span id="current-year"></span> SAJAD TROY / THE UPSIDE DOWN</span>
            <span>KERALA, INDIA</span>
        </footer>
    </div>

    <script>
        const API_URL = "https://grovix.dev/feed/author/68c59d72be7f447de8b7448a";

        async function fetchBlogs() {
            const postsContainer = document.getElementById('blog-posts');
            const loader = document.getElementById('posts-loader');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const articles = data.articles;

                loader.style.display = 'none';

                articles.forEach(article => {
                    const title = article.title;
                    const slug = article.slug;
                    const link = `https://grovix.dev/article/${slug}`;
                    const createdAt = new Date(article.createdAt);
                    const excerpt = article.description || "Read the full transmission on Grovix...";

                    const category = article.categories && article.categories.length > 0
                        ? article.categories.join(' / ')
                        : "General";

                    const month = createdAt.toLocaleString('default', { month: 'short' });
                    const year = createdAt.getFullYear();

                    const postHTML = `
                        <a href="${link}" target="_blank" class="post-item">
                            <div class="post-date">${month} ${year}</div>
                            <div class="post-content">
                                <span class="post-category">${category}</span>
                                <h3 class="post-title">${title}</h3>
                                <p class="post-excerpt">${excerpt}</p>
                            </div>
                        </a>
                    `;
                    postsContainer.innerHTML += postHTML;
                });

            } catch (error) {
                console.error("API Fetch Error:", error);
                loader.textContent = "Error: Signal lost in the Upside Down.";
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
        }

        setInterval(updateTime, 1000);
        updateTime();
        document.getElementById('current-year').textContent = new Date().getFullYear();

        fetchBlogs();
    </script>
</body>

</html>
