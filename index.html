<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sajad Troy | Software Engineer & Tech Creator</title>
  <meta name="description"
    content="Portfolio and link hub for Sajad Troy - Software Engineer and Tech Content Creator building cool things with technology.">
  <meta name="keywords" content="Sajad Troy, Software Engineer, Tech Creator, Coding, Live Streamer, Web Development">
  <meta name="author" content="Sajad Troy">
  <link rel="canonical" href="https://sajadtroy.com">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sajadtroy.com/">
  <meta property="og:title" content="Sajad Troy | Tech Portfolio">
  <meta property="og:description"
    content="Software engineer and content creator focused on coding, learning, and building technology.">
  <meta property="og:image" content="https://sajadtroy.com/sajadtroy.png">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://sajadtroy.com/">
  <meta property="twitter:title" content="Sajad Troy | Tech Portfolio">
  <meta property="twitter:description"
    content="Software engineer and content creator focused on coding, learning, and building technology.">
  <meta property="twitter:image" content="https://sajadtroy.com/sajadtroy.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f0202;
      --bg-accent: #3d0303;
      --primary-red: #cc2b2b;
      --bright-red: #ff4d4d;
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
      background-image:
        radial-gradient(circle at 15% 15%, var(--bg-accent) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, #610505 0%, transparent 45%);
      background-attachment: fixed;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Profile Section */
    .profile-box {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      padding: 30px;
      border-radius: 24px;
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      margin-bottom: 8px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 1px solid var(--glass-border);
      object-fit: cover;
      background: var(--bg-dark);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* Links List */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      padding: 18px 24px;
      border-radius: 18px;
      font-weight: 600;
      transition: background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(15px);
    }

    .link-item i {
      font-size: 1.2rem;
      width: 28px;
      margin-right: 12px;
      color: var(--primary-red);
      /* Removed transition for glow effect */
    }

    /* Hover States (Cleaned: No Translation, No Icon Glow) */
    .link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary-red);
      /* Removed transform: translateX */
    }

    .link-item:hover i {
      color: var(--bright-red);
      /* Removed text-shadow glow */
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      opacity: 0.7;
    }

    @media (max-width: 400px) {
      .profile-box {
        padding: 25px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <header class="profile-box">
      <img src="https://sajadtroy.com/sajadtroy.png" alt="Sajad Troy" class="avatar">
      <h1>Sajad Troy</h1>
      <p class="bio">
        Tech content creator, software engineer, and live streamer focused on coding, learning, and building cool things
        with technology.
      </p>
    </header>

    <nav class="links-list">
      <a href="https://youtube.com/@FtSajadTroy" class="link-item" target="_blank" rel="noopener">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>

      <a href="https://github.com/SajadTroy" class="link-item" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>

      <a href="https://instagram.com/sajadtroy" class="link-item" target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>

      <a href="mailto:st@sajadtroy.com" class="link-item">
        <i class="fa-solid fa-envelope"></i>
        <span>Email Contact</span>
      </a>
    </nav>

    <footer>
      Built by Sajad Troy &copy; <span id="current-year"></span>
    </footer>
  </div>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>

</body>

</html>
